[project]
name = "careerflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mihirg42", email = "guptamihir7@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.165.0",
]

[project.scripts]
careerflow = "careerflow:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
